<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Monoline: Architectural Astronaut Contour (Swiss / SF Symbols style) -->
  <rect width="512" height="512" fill="#07080A"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Helmet Contour -->
    <path d="M 155 310
             C 140 240, 150 145, 256 145
             C 362 145, 372 240, 357 310
             C 347 355, 310 375, 256 375
             C 202 375, 165 355, 155 310 Z"/>

    <!-- Inner Visor Slit (Monoline) -->
    <path d="M 185 240 
             C 185 210, 215 195, 256 195 
             C 297 195, 327 210, 327 240
             C 327 270, 297 285, 256 285
             C 215 285, 185 270, 185 240 Z"/>

    <!-- Collar Base Line -->
    <line x1="215" y1="400" x2="297" y2="400"/>
  </g>

  <!-- Red Accent Specular dot on visor edge -->
  <circle cx="305" cy="240" r="9" fill="#FF2E4D"/>
</svg>
