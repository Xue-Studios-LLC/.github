<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Astronaut: Solid Dome with Negative-Space Visor -->
  <rect width="512" height="512" fill="#07080A"/>
  
  <g fill="#FFFFFF">
    <!-- Helmet Dome (Solid clean silhouette) -->
    <path d="M 140 260
             C 140 180, 190 120, 256 120
             C 322 120, 372 180, 372 260
             C 372 315, 345 355, 305 372
             L 207 372
             C 167 355, 140 315, 140 260 Z"/>
             
    <!-- Neck Collar / Interface Base -->
    <rect x="200" y="392" width="112" height="18" rx="9" fill="#FFFFFF"/>
  </g>

  <!-- Visor cutout (Negative space showing background void) -->
  <rect x="180" y="215" width="152" height="54" rx="27" fill="#07080A"/>

  <!-- Optional single tiny precision accent: a single red point or clean slit -->
  <circle cx="310" cy="242" r="7" fill="#FF2E4D"/>
</svg>
