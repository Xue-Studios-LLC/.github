<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-x-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>

    <!-- Raycast Laser Glow Accent (#FF2E4D) -->
    <radialGradient id="laser-x-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(255, 46, 77, 0.28)"/>
      <stop offset="100%" stop-color="rgba(255, 46, 77, 0)"/>
    </radialGradient>

    <!-- Crimson Laser Beam Gradient -->
    <linearGradient id="beam-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B81"/>
      <stop offset="45%" stop-color="#FF2E4D"/>
      <stop offset="100%" stop-color="#99001A"/>
    </linearGradient>

    <!-- White Specular Beam Gradient -->
    <linearGradient id="beam-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Optical Core Filter -->
    <filter id="core-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-x-obsidian)"/>
  <circle cx="256" cy="256" r="210" fill="url(#laser-x-glow)"/>

  <!-- Precision Outer Frame -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- ============================================================== -->
  <!-- THE SPATIAL X (Raycast & Shader Intersection Mark)             -->
  <!-- ============================================================== -->
  <g transform="translate(256, 256)">
    <!-- Primary Laser Beam (Diagonal Down-Right at -35 deg alignment) -->
    <!-- Formed as a sleek hyper-faceted blade -->
    <polygon points="-125,-125 -65,-125 125,125 65,125" fill="url(#beam-crimson)"/>

    <!-- Specular Highlight Strip along Crimson Beam -->
    <line x1="-95" y1="-125" x2="95" y2="125" stroke="#FFA3B1" stroke-width="3" stroke-linecap="round"/>

    <!-- Secondary Intersecting Beam (White Chrome) with negative-space optical cutout -->
    <!-- Top-Right segment -->
    <polygon points="125,-125 65,-125 22,-38 52,-8" fill="url(#beam-white)"/>
    <!-- Bottom-Left segment -->
    <polygon points="-22,38 -52,8 -125,125 -65,125" fill="url(#beam-white)"/>

    <!-- Central Singularity / Quantum Core (Negative space + Laser Emitter) -->
    <circle cx="0" cy="0" r="30" fill="#07080A" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#FF2E4D" filter="url(#core-bloom)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>

    <!-- Orbital Coordinate Reference Rings (Subtle WebGPU Wireframe) -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="175" fill="none" stroke="rgba(255, 46, 77, 0.15)" stroke-width="1" stroke-dasharray="2 12"/>
  </g>
</svg>
