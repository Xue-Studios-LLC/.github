<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 1: The Monoline Astronaut Visor -->
  <!-- Pure geometry: An engineered helmet dome with a single wide visor cut -->
  <rect width="512" height="512" fill="#07080A"/>

  <!-- Helmet contour: Pure white, confident stroke -->
  <path d="M 160 330
           C 140 280, 140 180, 195 130
           C 225 102, 287 102, 317 130
           C 372 180, 372 280, 352 330
           C 336 370, 305 385, 256 385
           C 207 385, 176 370, 160 330 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- The Visor: Sleek panoramic horizontal pill in negative space / crimson or white -->
  <!-- Subtle crimson accent line for the visor aperture -->
  <rect x="186" y="212" width="140" height="48" rx="24" fill="#FF2E4D"/>
</svg>
