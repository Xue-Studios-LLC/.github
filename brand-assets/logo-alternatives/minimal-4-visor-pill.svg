<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Minimalist Astronaut: Iconic Helmet Sphere with Horizontal Visor -->
  <rect width="512" height="512" fill="#07080A"/>

  <!-- Helmet: Pure White Geometric Dome / Silhouette -->
  <!-- A rounded square with smooth curvature (squircle) or circle with flattened base -->
  <path d="M 136 240
           C 136 150, 190 120, 256 120
           C 322 120, 376 150, 376 240
           C 376 330, 332 372, 286 382
           L 226 382
           C 180 372, 136 330, 136 240 Z"
        fill="#FFFFFF"/>

  <!-- Visor: Sleek panoramic aperture (pure negative space void) -->
  <rect x="176" y="210" width="160" height="56" rx="28" fill="#07080A"/>

  <!-- Minimal red beacon status indicator / laser sensor point -->
  <circle cx="312" cy="238" r="8" fill="#FF2E4D"/>
</svg>
